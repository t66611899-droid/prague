name = "prague-chat"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# הסודות (ANTHROPIC_API_KEY, APP_TOKEN) לא נמצאים כאן. מגדירים אותם ב-Cloudflare בלבד.
[vars]
ALLOWED_ORIGIN = "https://t66611899-droid.github.io"
DAILY_LIMIT = "40"
# המפתח הציבורי של ההתראות. הפרטי (VAPID_JWK) שמור כ-Secret ב-Cloudflare בלבד
VAPID_PUBLIC = "BL1wKzVNWdylek1wLHayfBEwohzmUqydt-HzwKBf94lTeNoJAcdvZpq93BiAj7Xex35SbxXVUfU4d0vlgErjONA"

[[kv_namespaces]]
binding = "LIMITS"
id = "c5f11dadfd3e41be9e5de5a86034a664"

# חיפוש אירועים: 09:00 ו-16:00 בשעון פראג (חורף = UTC+1)
[triggers]
crons = ["0 8,15 * * *"]

# פרטי היומן (רגעים, תגובות, שיתוף) ב-D1: תמיד מעודכן, כדי ששתי תגובות מהירות לא ימחקו זו את זו.
# הקבצים עצמם (תמונות וסרטונים) נשארים ב-KV. שניהם בחינם, בלי כרטיס אשראי.
[[d1_databases]]
binding = "DB"
database_name = "prague-journal"
database_id = "690e7256-b69c-4e23-901b-77b156334103"
