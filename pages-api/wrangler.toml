# כתובת חלופית לשרת: חלק מהספקים בישראל לא פותרים כתובות *.workers.dev, אבל *.pages.dev כן.
# הדף הזה רק מעביר כל בקשה ל-Worker הקיים (prague-chat) דרך Service Binding פנימי של Cloudflare. אין כאן סודות ואין אחסון.
name = "prague-api"
pages_build_output_dir = "public"
compatibility_date = "2026-01-01"

[[services]]
binding = "API"
service = "prague-chat"
