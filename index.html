<style>
/* מסך טעינה מיידי: בתוך ה-HTML, בלי לחכות לשום קובץ. נעלם כשהממשק מוכן */
html{background:#14161b}
#boot{position:fixed;inset:0;z-index:99990;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(130% 90% at 50% 28%,#3a1519 0,#14161b 62%);color:#fff;font:600 1rem/1.4 -apple-system,system-ui,sans-serif;direction:rtl;transition:opacity .35s}
#boot.out{opacity:0;pointer-events:none}
#boot svg{width:88px;height:88px;border-radius:22px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
#boot b{font-size:1.5rem;letter-spacing:.01em}
#boot i{width:30px;height:30px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:#e8a317;animation:bootSp .8s linear infinite}
#boot small{opacity:.6;font-weight:500}
@keyframes bootSp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#boot i{animation-duration:2.4s}}
</style>

<script>
/* שומר עלייה: אם משהו נכשל בעלייה, במקום מסך לבן מופיע "משהו השתבש · לטעון מחדש".
   הניקוי מוחק רק את קבצי האפליקציה השמורים (מטמון + service worker), אף פעם לא את הנתונים (פרטים, כרטיסים, יומן). */
(function () {
  var errs = [];
  function note(m) { try { m = String(m || "").slice(0, 300); errs.push(m); localStorage.setItem("prg.lastErr", JSON.stringify({ t: Date.now(), m: m, ua: navigator.userAgent.slice(0, 160) })); } catch (e) {} }
  window.__bootErrs = errs;
  window.addEventListener("error", function (e) { if (/cine\.js/.test(e.filename || "")) return; if (!window.__ui) note((e.message || "error") + " @ " + String(e.filename || "").split("/").pop() + ":" + (e.lineno || "")); }, true);
  window.addEventListener("unhandledrejection", function (e) { if (!window.__ui) note("promise: " + (e.reason && (e.reason.message || e.reason))); });
  window.__safeReload = function () {
    var b = document.getElementById("bootFailBtn"); if (b) { b.disabled = true; b.textContent = "מנקה ומעלה מחדש…"; }
    var jobs = [];
    try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return k.indexOf("prg-v") === 0; }).map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
    Promise.all(jobs).then(go, go); setTimeout(go, 4000);
  };
  function show() {
    if (window.__ui || document.getElementById("bootFail")) return;
    var d = document.createElement("div"); d.id = "bootFail";
    d.setAttribute("style", "position:fixed;inset:0;z-index:99999;background:#14161b;color:#fff;font:16px/1.5 -apple-system,system-ui,sans-serif;direction:rtl;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px");
    d.innerHTML = '<div style="font-size:3rem">🧳</div><h1 style="margin:10px 0 6px;font-size:1.5rem">משהו השתבש בעלייה</h1><p style="margin:0 0 18px;opacity:.8;max-width:30ch">הנתונים שלך שמורים ולא נמחקים (פרטים, כרטיסים, יומן). רק טוענים את האפליקציה מחדש.</p><button id="bootFailBtn" style="min-height:54px;min-width:220px;border:0;border-radius:27px;background:#d42a33;color:#fff;font:700 1.1rem -apple-system,system-ui,sans-serif">לטעון מחדש</button><details style="margin-top:22px;opacity:.6;font-size:.8rem;max-width:90vw"><summary>פרטים טכניים</summary><div dir="ltr" style="text-align:left;word-break:break-word;margin-top:6px" id="bootFailMsg"></div></details>';
    (document.body || document.documentElement).appendChild(d);
    document.getElementById("bootFailMsg").textContent = (errs.join(" | ") || "timeout") + " · " + (document.querySelector('script[src*="extras.js"]') || {}).src;
    document.getElementById("bootFailBtn").onclick = window.__safeReload;
  }
  window.__bootFail = show;
  /* בדיקה: אחרי 2.5 שנ' עם שגיאה, או אחרי 15 שנ' בלי שהממשק עלה */
  setTimeout(function () { if (!window.__ui && errs.length) show(); }, 2500);
  var waited = 0; (function later() { waited += 5000; setTimeout(function () { if (window.__ui) return; if (document.readyState === "complete" || waited >= 45000) show(); else later(); }, waited === 5000 ? 15000 : 5000); })(); // ברשת איטית מחכים שהקבצים ייטענו
})();
</script>

<script>
/* התאוששות: אם העלייה נכשלת (למשל קבצים מגרסאות שונות מיד אחרי עדכון), מנקים את מטמון האפליקציה וטוענים מחדש פעם אחת */
window.__boot = function (why) {
  try { if (window.__booted || Date.now() - (+sessionStorage.getItem("prg.heal") || 0) < 60000) return; sessionStorage.setItem("prg.heal", Date.now()); } catch (e) { return; }
  var go = function () { location.replace(location.pathname + "?r=" + Date.now() + location.hash); };
  if (window.caches) caches.keys().then(function (ks) { return Promise.all(ks.filter(function (k) { return /^prg-v/.test(k); }).map(function (k) { return caches.delete(k); })); }).then(go, go); else go();
};
window.addEventListener("error", function (e) { if (!window.__booted) window.__boot(e.message); });
window.addEventListener("unhandledrejection", function (e) { if (!window.__booted) window.__boot(String(e.reason)); });
</script>
